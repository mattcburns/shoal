---
# Validate that every Shoal lab dependency is reachable.
# Runs on the L0 host (l0); HTTP checks hit shoal_service_host (the VM IP in
# VM-hosted mode, 127.0.0.1 in direct mode). Serial-console checks delegate to
# the host that owns the nested libvirt (shoal_serial_delegate).
# Run with:
#   ansible-playbook -i infra/ansible/inventory/lab-vm.yml infra/ansible/playbooks/smoke.yml   (VM-hosted)
#   ansible-playbook -i infra/ansible/inventory/lab.yml     infra/ansible/playbooks/smoke.yml   (direct)

- name: Validate Shoal lab dependencies
  hosts: l0
  gather_facts: false
  tasks:
    - name: Check NetBox API
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_netbox_port }}/api/"
        headers:
          Authorization: "Token {{ shoal_netbox_api_token }}"
        method: GET
        status_code: [200]
        timeout: 10
      register: smoke_netbox
      no_log: true
      failed_when: false
      changed_when: false

    - name: Check Redfish root
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_sushy_port }}/redfish/v1/"
        url_username: "{{ shoal_bmc_username }}"
        url_password: "{{ shoal_bmc_password }}"
        force_basic_auth: true
        method: GET
        status_code: [200]
        timeout: 10
      register: smoke_redfish_root
      failed_when: false
      changed_when: false

    - name: Check Redfish Systems collection
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_sushy_port }}/redfish/v1/Systems"
        url_username: "{{ shoal_bmc_username }}"
        url_password: "{{ shoal_bmc_password }}"
        force_basic_auth: true
        method: GET
        status_code: [200]
        timeout: 10
      register: smoke_redfish_systems
      failed_when: false
      changed_when: false

    - name: Check Ollama
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_ollama_port }}/api/tags"
        method: GET
        status_code: [200]
        timeout: 10
      register: smoke_ollama
      failed_when: false
      changed_when: false

    # Ollama /api/tags returns { "models": [ { "name": "llama3.2:3b", ... }, ... ] }.
    # Match configured model as a prefix of the reported name (tag may add digests later).
    - name: Assert Ollama text model is present
      ansible.builtin.assert:
        that:
          - smoke_ollama.status == 200
          - smoke_ollama.json.models is defined
          - >
            smoke_ollama.json.models
            | map(attribute='name')
            | select('search', '^' + (shoal_ai_model | regex_escape))
            | list
            | length > 0
        fail_msg: >-
          Ollama text model {{ shoal_ai_model }} not found in /api/tags.
          Models: {{ smoke_ollama.json.models | default([]) | map(attribute='name') | list }}.
          Pull with: docker exec shoal-ollama ollama pull {{ shoal_ai_model }}
        success_msg: "Ollama text model present: {{ shoal_ai_model }}"
      when: smoke_ollama.status == 200

    - name: Assert Ollama vision model is present
      ansible.builtin.assert:
        that:
          - smoke_ollama.status == 200
          - smoke_ollama.json.models is defined
          - >
            smoke_ollama.json.models
            | map(attribute='name')
            | select('search', '^' + (shoal_ai_vision_model | regex_escape))
            | list
            | length > 0
        fail_msg: >-
          Ollama vision model {{ shoal_ai_vision_model }} not found in /api/tags.
          Models: {{ smoke_ollama.json.models | default([]) | map(attribute='name') | list }}.
          Pull with: docker exec shoal-ollama ollama pull {{ shoal_ai_vision_model }}
          (or set shoal_ai_vision_model: "" to skip vision in this lab).
        success_msg: "Ollama vision model present: {{ shoal_ai_vision_model }}"
      when:
        - smoke_ollama.status == 200
        - (shoal_ai_vision_model | default('') | length) > 0

    - name: Check ISO HTTP server
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_iso_server_port }}/"
        method: GET
        status_code: [200, 403, 404]
        timeout: 10
      register: smoke_iso
      failed_when: false
      changed_when: false

    - name: Check Shoal app healthz (Phase 6d Compose, when enabled)
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_app_http_port | default(8088) }}/healthz"
        method: GET
        status_code: [200]
        timeout: 10
      register: smoke_shoal
      failed_when: false
      changed_when: false
      when: shoal_compose_app | default(true) | bool

    - name: Check Shoal app metrics (Phase 6d)
      ansible.builtin.uri:
        url: "http://{{ shoal_service_host }}:{{ shoal_app_http_port | default(8088) }}/metrics"
        method: GET
        status_code: [200]
        timeout: 10
      register: smoke_shoal_metrics
      failed_when: false
      changed_when: false
      when: shoal_compose_app | default(true) | bool

    - name: Check each node serial console
      ansible.builtin.command: "virsh ttyconsole {{ node.name }}"
      loop: "{{ shoal_bmc_nodes }}"
      loop_control:
        loop_var: node
        label: "{{ node.name }}"
      delegate_to: "{{ shoal_serial_delegate }}"
      become: true
      environment:
        LIBVIRT_DEFAULT_URI: qemu:///system
      register: smoke_serial
      changed_when: false
      failed_when: false

    - name: Assert every serial console is attached
      ansible.builtin.assert:
        that:
          - res.rc == 0
          - res.stdout | trim | length > 0
        fail_msg: "Serial console check failed for {{ res.node.name }} (rc={{ res.rc }}, stderr={{ res.stderr | default('') | trim }})"
        success_msg: "Serial console OK for {{ res.node.name }} -> {{ res.stdout | trim }}"
      loop: "{{ smoke_serial.results }}"
      loop_control:
        loop_var: res
        label: "{{ res.node.name }}"

    # Nested domains need an empty CD tray for sushy Virtual Media (no CD hotplug).
    - name: Check nested node empty CD tray for Virtual Media
      ansible.builtin.shell: |
        set -e
        xml="$(virsh dumpxml {{ node.name }})"
        echo "$xml" | grep -q "device='cdrom'"
      args:
        executable: /bin/bash
      loop: "{{ shoal_bmc_nodes }}"
      loop_control:
        loop_var: node
        label: "{{ node.name }}"
      delegate_to: "{{ shoal_serial_delegate }}"
      become: true
      environment:
        LIBVIRT_DEFAULT_URI: qemu:///system
      register: smoke_cdrom
      changed_when: false
      failed_when: false

    - name: Assert every nested node has a CD-ROM device
      ansible.builtin.assert:
        that:
          - res.rc == 0
        fail_msg: >-
          No empty CD tray on {{ res.node.name }}. Re-run lab_up / libvirt_lab so
          vm-node.xml.j2 includes device=cdrom (required for sushy InsertMedia).
        success_msg: "CD tray present for Virtual Media on {{ res.node.name }}"
      loop: "{{ smoke_cdrom.results }}"
      loop_control:
        loop_var: res
        label: "{{ res.node.name }}"

    - name: Assert HTTP dependency checks
      ansible.builtin.assert:
        that:
          - smoke_netbox.status == 200
          - smoke_redfish_root.status == 200
          - smoke_redfish_systems.status == 200
          - smoke_ollama.status == 200
          - smoke_iso.status in [200, 403, 404]
          - >-
            (not (shoal_compose_app | default(true) | bool))
            or (smoke_shoal.status | default(0) == 200
                and smoke_shoal_metrics.status | default(0) == 200)
        fail_msg: >-
          Smoke checks failed --
          NetBox={{ smoke_netbox.status | default('err') }},
          Redfish root={{ smoke_redfish_root.status | default('err') }},
          Redfish Systems={{ smoke_redfish_systems.status | default('err') }},
          Ollama={{ smoke_ollama.status | default('err') }},
          ISO HTTP={{ smoke_iso.status | default('err') }},
          Shoal healthz={{ smoke_shoal.status | default('skipped') }},
          Shoal metrics={{ smoke_shoal_metrics.status | default('skipped') }}.
          (200/403/404 are acceptable for the ISO server.)
        success_msg: >-
          All HTTP smoke checks passed: NetBox, Redfish root, Redfish Systems,
          Ollama, ISO HTTP{% if shoal_compose_app | default(true) | bool %}, and Shoal app{% endif %}.
