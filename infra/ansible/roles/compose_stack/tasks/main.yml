---
# Deploy and configure Docker Compose stack
# This role deploys NetBox, PostgreSQL, Redis, Ollama, and HTTP server

# Phase 6d: build CGO-free binary on the controller, stage on the lab host.
- name: Ensure local staging dir for shoal binary (controller)
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../../.shoal/lab-build"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  when: shoal_compose_app | default(true) | bool
  tags: [config, shoal]

- name: Build shoal binary on controller (linux/amd64, CGO-free)
  ansible.builtin.command:
    argv:
      - go
      - build
      - -trimpath
      - -ldflags
      - -s -w
      - -o
      - "{{ playbook_dir }}/../../../.shoal/lab-build/shoal"
      - ./cmd/shoal
  environment:
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: "{{ shoal_compose_app_goarch | default('amd64') }}"
  args:
    chdir: "{{ playbook_dir }}/../../.."
  delegate_to: localhost
  become: false
  when: shoal_compose_app | default(true) | bool
  tags: [config, shoal]

- name: Ensure shoal image build context on lab host
  file:
    path: "{{ shoal_compose_dir }}/shoal-build"
    state: directory
    mode: '0755'
  when: shoal_compose_app | default(true) | bool
  tags: [config, shoal]

- name: Copy shoal binary to lab host build context
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../.shoal/lab-build/shoal"
    dest: "{{ shoal_compose_dir }}/shoal-build/shoal"
    mode: '0755'
  when: shoal_compose_app | default(true) | bool
  tags: [config, shoal]

- name: Install Dockerfile for shoal lab image
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/docker/Dockerfile"
    dest: "{{ shoal_compose_dir }}/shoal-build/Dockerfile"
    mode: '0644'
  when: shoal_compose_app | default(true) | bool
  tags: [config, shoal]

- name: Stage netbox_shoal plugin build context on lab host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../extras/netbox-plugin-shoal/"
    dest: "{{ shoal_compose_dir }}/netbox-shoal-build/"
    mode: '0644'
    directory_mode: '0755'
  when: shoal_netbox_plugin | default(true) | bool
  tags: [config, shoal]

- name: Copy Docker Compose file
  template:
    src: docker-compose.lab.yml.j2
    dest: "{{ shoal_compose_dir }}/docker-compose.lab.yml"
    mode: '0644'
  tags: [config]

- name: Copy environment file
  template:
    src: env.j2
    dest: "{{ shoal_compose_dir }}/.env"
    mode: '0600'
  tags: [config]

# Parent must be traversable by the app user; fewshot/profile dirs are writable by
# the remote login user (lab on L1; often the operator running direct-mode).
- name: Ensure shoal state parent directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: >-
    {{
      (
        ([shoal_fewshot_dir | dirname] if (shoal_fewshot_dir | default('') | length) > 0 else [])
        + ([shoal_profile_dir | dirname] if (shoal_profile_dir | default('') | length) > 0 else [])
        + ([shoal_secrets_dir | dirname] if (shoal_secrets_dir | default('') | length) > 0 else [])
      ) | unique | list
    }}
  tags: [config]

- name: Ensure few-shot learning directory exists
  file:
    path: "{{ shoal_fewshot_dir }}"
    state: directory
    mode: '0750'
    owner: "{{ ansible_user | default(shoal_lab_vm_user) }}"
    group: "{{ ansible_user | default(shoal_lab_vm_user) }}"
  when: (shoal_fewshot_dir | default('') | length) > 0
  tags: [config]

- name: Ensure provisioning profile directory exists
  file:
    path: "{{ shoal_profile_dir }}"
    state: directory
    mode: '0750'
    owner: "{{ ansible_user | default(shoal_lab_vm_user) }}"
    group: "{{ ansible_user | default(shoal_lab_vm_user) }}"
  when: (shoal_profile_dir | default('') | length) > 0
  tags: [config]

- name: Ensure durable secrets directory exists
  file:
    path: "{{ shoal_secrets_dir }}"
    state: directory
    mode: '0700'
    owner: "{{ ansible_user | default(shoal_lab_vm_user) }}"
    group: "{{ ansible_user | default(shoal_lab_vm_user) }}"
  when: (shoal_secrets_dir | default('') | length) > 0
  tags: [config]

- name: Ensure raw SOL capture directory exists
  file:
    path: "{{ shoal_sol_debug_dir }}"
    state: directory
    mode: '0750'
    owner: "{{ ansible_user | default(shoal_lab_vm_user) }}"
    group: "{{ ansible_user | default(shoal_lab_vm_user) }}"
  when: (shoal_sol_debug_dir | default('') | length) > 0
  tags: [config]

- name: Ensure NetBox configuration directory exists
  file:
    path: "{{ shoal_compose_dir }}/netbox-config"
    state: directory
    mode: '0755'
  tags: [config]

- name: Generate NetBox secret key if missing
  shell:
    executable: /bin/bash
    cmd: |
      if [ -s "{{ shoal_compose_dir }}/netbox-config/secret_key.py" ]; then
        exit 0
      fi
      python3 - <<'PY'
      import secrets
      key = ''.join(secrets.choice('abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*(-_=+)') for _ in range(64))
      print(f'SECRET_KEY = {key!r}')
      PY
  register: generated_secret
  no_log: true
  changed_when: generated_secret.stdout | length > 0
  tags: [config]

- name: Write NetBox secret key file
  copy:
    content: "{{ generated_secret.stdout | default('') }}"
    dest: "{{ shoal_compose_dir }}/netbox-config/secret_key.py"
    mode: '0644'
  when: generated_secret.stdout | default('') | length > 0
  no_log: true
  tags: [config]

- name: Write NetBox plugins.py (netbox_shoal)
  template:
    src: netbox-plugins.py.j2
    dest: "{{ shoal_compose_dir }}/netbox-config/plugins.py"
    mode: '0644'
  when: shoal_netbox_plugin | default(true) | bool
  tags: [config, shoal]

- name: Generate NetBox API token pepper if missing
  shell:
    executable: /bin/bash
    cmd: |
      if [ -s "{{ shoal_compose_dir }}/netbox-config/api_token_pepper_1" ]; then
        exit 0
      fi
      python3 - <<'PY'
      import secrets
      pepper = ''.join(secrets.choice('abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*(-_=+)') for _ in range(64))
      print(pepper)
      PY
  register: generated_api_token_pepper
  no_log: true
  changed_when: generated_api_token_pepper.stdout | length > 0
  tags: [config]

- name: Write NetBox API token pepper file
  copy:
    content: "{{ generated_api_token_pepper.stdout | default('') }}"
    dest: "{{ shoal_compose_dir }}/netbox-config/api_token_pepper_1"
    mode: '0644'
  when: generated_api_token_pepper.stdout | default('') | length > 0
  no_log: true
  tags: [config]

- name: Start Docker Compose stack
  shell: |
    cd {{ shoal_compose_dir }}
    docker compose -f docker-compose.lab.yml up -d --build
  register: compose_up
  changed_when: >
    'Creating' in ((compose_up.stdout | default('')) ~ (compose_up.stderr | default('')))
    or 'Starting' in ((compose_up.stdout | default('')) ~ (compose_up.stderr | default('')))
    or 'Recreating' in ((compose_up.stdout | default('')) ~ (compose_up.stderr | default('')))
    or 'Pulling' in ((compose_up.stdout | default('')) ~ (compose_up.stderr | default('')))
    or 'Building' in ((compose_up.stdout | default('')) ~ (compose_up.stderr | default('')))
  tags: [start]

- name: Wait for PostgreSQL to be healthy
  shell:
    executable: /bin/bash
    cmd: |
      for i in {1..30}; do
        health=$(docker inspect -f '{% raw %}{{.State.Health.Status}}{% endraw %}' shoal-postgres 2>/dev/null || echo "")
        if [ "$health" = "healthy" ]; then exit 0; fi
        sleep 2
      done
      echo "Timed out waiting for PostgreSQL to become healthy" >&2
      docker inspect -f '{% raw %}{{json .State.Health}}{% endraw %}' shoal-postgres 2>/dev/null || true
      docker logs --tail 50 shoal-postgres 2>&1 || true
      exit 1
  register: pg_ready
  changed_when: false
  tags: [wait]

- name: Wait for Redis to be healthy
  shell:
    executable: /bin/bash
    cmd: |
      for i in {1..30}; do
        health=$(docker inspect -f '{% raw %}{{.State.Health.Status}}{% endraw %}' shoal-redis 2>/dev/null || echo "")
        if [ "$health" = "healthy" ]; then exit 0; fi
        sleep 2
      done
      echo "Timed out waiting for Redis to become healthy" >&2
      docker inspect -f '{% raw %}{{json .State.Health}}{% endraw %}' shoal-redis 2>/dev/null || true
      docker logs --tail 50 shoal-redis 2>&1 || true
      exit 1
  register: redis_ready
  changed_when: false
  tags: [wait]

- name: Wait for NetBox to be healthy
  shell:
    executable: /bin/bash
    cmd: |
      for i in {1..180}; do
        health=$(docker inspect -f '{% raw %}{{.State.Health.Status}}{% endraw %}' shoal-netbox 2>/dev/null || echo "")
        if [ "$health" = "healthy" ]; then exit 0; fi
        sleep 5
      done
      echo "Timed out waiting for NetBox to become healthy" >&2
      docker inspect -f '{% raw %}{{json .State.Health}}{% endraw %}' shoal-netbox 2>/dev/null || true
      docker logs --tail 50 shoal-netbox 2>&1 || true
      exit 1
  register: netbox_healthy
  changed_when: false
  tags: [wait]

- name: Wait for Ollama to be ready
  uri:
    url: "{{ shoal_ollama_url }}/api/tags"
    method: GET
    status_code: 200
  register: ollama_ready
  until: ollama_ready.status == 200
  retries: 20
  delay: 3
  tags: [wait]

# Text model is required; vision model is optional (empty string skips pull).
# Sequential pulls keep nested-lab Ollama memory pressure lower than parallel.
- name: Build Ollama model pull list
  set_fact:
    shoal_ollama_models_to_pull: >-
      {{
        ([shoal_ai_model] + ([shoal_ai_vision_model] if (shoal_ai_vision_model | default('') | length) > 0 else []))
        | unique
        | list
      }}
  tags: [ollama]

- name: Pull Ollama models (text + optional vision)
  ansible.builtin.command:
    cmd: docker exec shoal-ollama ollama pull {{ item }}
  loop: "{{ shoal_ollama_models_to_pull }}"
  loop_control:
    label: "{{ item }}"
  register: model_pull
  # Pulls are slow and may be no-ops if the model is already present; always report changed=false
  # would hide real work — mark changed on success so operators see which models were processed.
  changed_when: model_pull.rc == 0
  failed_when: model_pull.rc != 0
  tags: [ollama]

- name: Display Compose stack status
  debug:
    msg: |
      Docker Compose stack is running.

      Services:
      - NetBox: {{ shoal_netbox_url }}
      - PostgreSQL: localhost:5432 (netbox)
      - Redis: localhost:6379
      - Ollama: {{ shoal_ollama_url }}
        models: {{ shoal_ollama_models_to_pull | join(', ') }}
      - HTTP Server: http://{{ ansible_host }}:{{ shoal_iso_server_port }}
      - Telemetry DB: localhost:5433 (shoal_telemetry)
      {% if shoal_compose_app | default(true) | bool %}- Shoal app: http://{{ shoal_service_host | default(ansible_host) }}:{{ shoal_app_http_port }}/healthz
      {% endif %}
  tags: [status]
