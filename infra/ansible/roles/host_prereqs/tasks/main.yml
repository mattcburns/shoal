---
# Install host prerequisites for Shoal lab
# This role ensures all required packages and services are installed

- name: Update package cache (Debian family)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  tags: [packages]

- name: Install required packages (Debian family)
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - libvirt-daemon-system
      - libvirt-clients
      - qemu-system-x86
      - qemu-utils
      - bridge-utils
      - virtinst
      - docker.io
      # Ubuntu 22.04 (jammy) ships the Compose v2 CLI plugin as
      # 'docker-compose-v2' (universe); 'docker-compose-plugin' is Docker's
      # own repo name and has no candidate in Ubuntu's archive.
      - docker-compose-v2
      - python3-passlib
      - git
      - curl
      - wget
    state: present
  when: ansible_os_family == "Debian"
  tags: [packages]

- name: Note manual package setup for non-Debian systems
  debug:
    msg: "Automatic package install is defined for Debian-family hosts only; install prerequisites manually for {{ ansible_os_family }}."
  when: ansible_os_family != "Debian"
  tags: [packages]

- name: Start and enable libvirtd
  systemd:
    name: libvirtd
    state: started
    enabled: yes
  tags: [services]

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  tags: [services]
- name: Determine the primary non-root lab user
  set_fact:
    shoal_primary_user: >-
      {{ ansible_env.SUDO_USER | default(ansible_user, true) | default(ansible_user_id, true) }}
  tags: [permissions]

- name: Add user to libvirt group
  user:
    name: "{{ shoal_primary_user }}"
    groups: libvirt
    append: yes
  tags: [permissions]

- name: Add user to docker group
  user:
    name: "{{ shoal_primary_user }}"
    groups: docker
    append: yes
  tags: [permissions]

- name: Create Shoal infrastructure directory
  file:
    path: "{{ shoal_infra_dir }}"
    state: directory
    mode: "0755"
  tags: [directories]

- name: Create ISO server directory
  file:
    path: "{{ shoal_iso_server_dir }}"
    state: directory
    mode: "0755"
  tags: [directories]

- name: Ensure Shoal Python virtualenv exists
  command: "python3 -m venv {{ shoal_infra_dir }}/.venv"
  args:
    creates: "{{ shoal_infra_dir }}/.venv/bin/activate"
  tags: [python]

- name: Install Python packages in Shoal virtualenv
  pip:
    name:
      - sushy
      - pynetbox
      - pyyaml
      - requests
    state: present
    virtualenv: "{{ shoal_infra_dir }}/.venv"
    virtualenv_command: "python3 -m venv"
  tags: [python]
