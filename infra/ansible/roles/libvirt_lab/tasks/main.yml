---
# Configure libvirt for Shoal lab
# This role sets up the libvirt network and creates virtual BMC nodes

- name: Copy libvirt network definition
  template:
    src: lab-network.xml.j2
    dest: /tmp/shoal-lab-net.xml
    mode: '0644'
  tags: [network]

- name: Define libvirt network
  command: virsh net-define /tmp/shoal-lab-net.xml
  register: net_define
  changed_when: >
    'defined' in (((net_define.stdout | default('')) ~ (net_define.stderr | default(''))) | lower)
  failed_when: >
    net_define.rc != 0 and
    'already exists' not in (((net_define.stdout | default('')) ~ (net_define.stderr | default(''))) | lower)
  tags: [network]

- name: Start libvirt network
  command: virsh net-start shoal-lab-net
  register: net_start
  changed_when: >
    'started' in (((net_start.stdout | default('')) ~ (net_start.stderr | default(''))) | lower)
  failed_when: >
    net_start.rc != 0 and
    'already active' not in (((net_start.stdout | default('')) ~ (net_start.stderr | default(''))) | lower)
  tags: [network]

- name: Read libvirt network status
  command: virsh net-info shoal-lab-net
  register: net_info
  changed_when: false
  tags: [network]

- name: Set libvirt network to autostart
  command: virsh net-autostart shoal-lab-net
  when: net_info.stdout is search('Autostart:\s+no')
  changed_when: true
  tags: [network]
- name: Ensure default libvirt images directory exists
  file:
    path: /var/lib/libvirt/images
    state: directory
    mode: '0755'
  tags: [storage]

- name: Check whether default libvirt storage pool exists
  command: virsh pool-info default
  register: default_pool_info
  changed_when: false
  failed_when:
    - default_pool_info.rc != 0
    - "'Storage pool not found' not in (default_pool_info.stderr | default(''))"
  tags: [storage]

- name: Define default libvirt storage pool when absent
  command: virsh pool-define-as --name default --type dir --target /var/lib/libvirt/images
  when: default_pool_info.rc != 0
  register: default_pool_define
  changed_when: "'defined' in (default_pool_define.stdout | lower)"
  tags: [storage]

- name: Start default libvirt storage pool
  command: virsh pool-start default
  register: default_pool_start
  changed_when: default_pool_start.rc == 0
  failed_when:
    - default_pool_start.rc != 0
    - "'already active' not in (((default_pool_start.stdout | default('')) ~ (default_pool_start.stderr | default(''))) | lower)"
  tags: [storage]

- name: Refresh default libvirt storage pool state
  command: virsh pool-info default
  register: default_pool_info_after_start
  changed_when: false
  tags: [storage]

- name: Enable default libvirt storage pool autostart
  command: virsh pool-autostart default
  when: default_pool_info_after_start.stdout is search('Autostart:\s+no')
  changed_when: true
  tags: [storage]


- name: Create virtual BMC nodes
  include_tasks: create_node.yml
  loop: "{{ shoal_bmc_nodes }}"
  loop_control:
    loop_var: node
  tags: [nodes]

- name: Verify all nodes are running
  shell: |
    for node in {{ shoal_bmc_nodes | map(attribute='name') | join(' ') }}; do
      virsh domstate $node
    done
  register: node_states
  changed_when: false
  tags: [verify]

- name: Display node states
  debug:
    msg: "Virtual BMC nodes status:\n{{ node_states.stdout }}"
  tags: [verify]
