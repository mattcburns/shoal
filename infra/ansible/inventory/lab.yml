---
# Direct host lab inventory.
# The lab stack runs on the L0 host itself; shoal-lab-vm is an alias for
# localhost (connection local). Everything sits under `direct_mode` so
# direct_mode.yml vars apply.
all:
  children:
    direct_mode:
      children:
        l0:
          hosts:
            shoal-lab-vm:
              ansible_connection: local
              ansible_host: 127.0.0.1
              ansible_python_interpreter: "{{ ansible_playbook_python }}"
