version: '3.8'

services:
  # NetBox - Source of truth for device identity and lifecycle state
  netbox:
    image: netboxcommunity/netbox:latest
    container_name: shoal-netbox
    environment:
      - SUPERUSER_NAME=admin
      - SUPERUSER_EMAIL=admin@example.com
      - SUPERUSER_PASSWORD=admin
      - DB_NAME=netbox
      - DB_USER=netbox
      - DB_PASSWORD=${SHOAL_NETBOX_POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SHOAL_REDIS_PASSWORD}
      - ALLOWED_HOSTS=*
    ports:
      - "${SHOAL_NETBOX_PORT}:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    restart: unless-stopped

  # PostgreSQL for NetBox
  postgres:
    image: postgres:15
    container_name: shoal-postgres
    environment:
      - POSTGRES_DB=netbox
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=${SHOAL_NETBOX_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis for NetBox caching
  redis:
    image: redis:7-alpine
    container_name: shoal-redis
    command: redis-server --requirepass ${SHOAL_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # HTTP server for serving ISO images to BMCs
  http-server:
    image: nginx:alpine
    container_name: shoal-http-server
    ports:
      - "${SHOAL_ISO_SERVER_PORT}:80"
    volumes:
      - ${SHOAL_ISO_SERVER_DIR}:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: shoal-ollama
    ports:
      - "${SHOAL_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Telemetry store (PostgreSQL for time-series data)
  telemetry-db:
    image: postgres:15
    container_name: shoal-telemetry-db
    environment:
      - POSTGRES_DB=shoal_telemetry
      - POSTGRES_USER=shoal
      - POSTGRES_PASSWORD=shoal_password
    ports:
      - "${SHOAL_TELEMETRY_DB_PORT:-5433}:5432"
    volumes:
      - telemetry-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  postgres-data:
  redis-data:
  ollama-data:
  telemetry-data:
